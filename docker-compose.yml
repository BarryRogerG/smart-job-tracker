services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_job_tracker
    ports:
      - "5432:5432"
    volumes:
      - smart_job_tracker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_job_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smart_job_tracker?schema=public
      JWT_SECRET: ${JWT_SECRET:-smart-job-tracker-docker-dev-secret-min-40-chars-long}
      JWT_EXPIRES_IN: "7d"
    depends_on:
      db:
        condition: service_healthy

volumes:
  smart_job_tracker_pg:
